name: Test published Windows startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and launch the published application
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1
      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnostics
          path: startup-diagnostics/
