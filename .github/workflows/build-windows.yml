name: Build and publish Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DUB_PORT_WORK_ROOT: ${{ github.workspace }}/work
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/builder-cache
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: |
          python -m pip install pillow
          npm install --no-audit --no-fund electron-builder@26.18.0 resedit@3.1.1
      - name: Assemble and verify the installer
        run: python scripts/build.py
      - name: Upload and publish release
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload v0.1.0-windows.1 "$DUB_PORT_WORK_ROOT/release/Dub-Off-Editor-0.1.0-Windows-x64-Setup.exe" "$DUB_PORT_WORK_ROOT/release/Dub-Off-Editor-0.1.0-Windows-x64-Portable.zip" "$DUB_PORT_WORK_ROOT/release/SHA256SUMS.txt" --clobber --repo "$REPOSITORY"
          gh release edit v0.1.0-windows.1 --draft=false --prerelease --notes-file "$DUB_PORT_WORK_ROOT/release/notes.md" --repo "$REPOSITORY"
      - name: Record the published checksum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record published installer checksum'
            git push
          fi
